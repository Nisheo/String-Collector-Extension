<!DOCTYPE html>
<html>
<head>
    <title>GitHub String Collector</title>

    <style>
        body {
            width: 400px;
            padding: 16px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            cursor: pointer;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #0256c7;
        }

        button:active {
            background: #024ea4;
        }

        #copyButton {
            background: #6f42c1;
        }

        #copyButton:hover {
            background: #5a32a3;
        }

        #updateSheetButton {
            background: #0f9d58;
        }

        #updateSheetButton:hover {
            background: #0d8549;
        }

        #updateSheetButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .button-group {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-group button {
            margin-top: 0;
            padding: 8px;
            font-size: 13px;
        }

        #downloadCSVButton {
            background: #17a2b8;
        }

        #downloadCSVButton:hover {
            background: #138496;
        }

        #mergeHelperButton {
            background: #fd7e14;
        }

        #mergeHelperButton:hover {
            background: #e8690b;
        }

        .helper-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #fff8e6;
            border: 1px solid #fb8500;
            border-radius: 6px;
            font-size: 12px;
        }

        .helper-box h4 {
            margin: 0 0 8px 0;
            color: #fb8500;
            font-size: 13px;
        }

        .helper-box code {
            display: block;
            background: white;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            margin: 8px 0;
            overflow-x: auto;
        }

        .helper-box ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .helper-box li {
            margin: 4px 0;
        }

        .copy-formula-btn {
            width: 100%;
            padding: 6px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 4px;
        }

        .copy-formula-btn:hover {
            background: #0256c7;
        }

        #status {
            margin-top: 12px;
            font-weight: bold;
        }

        #output {
            margin-top: 12px;
            max-height: 400px;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: white;
        }

        th {
            background: #0366d6;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #e1e4e8;
            vertical-align: top;
            word-break: break-word;
        }

        tr:hover {
            background: #f6f8fa;
        }

        .key-cell {
            font-family: monospace;
            font-size: 11px;
            color: #0366d6;
            max-width: 200px;
        }

        .value-cell {
            color: #24292e;
        }

        .status-cell {
            text-align: center;
            vertical-align: middle;
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            color: #586069;
            background: #f6f8fa;
            border-radius: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 3px;
        }

        .badge-added {
            background: #28a745;
            color: white;
        }

        .badge-modified {
            background: #fb8500;
            color: white;
        }

        .badge-deleted {
            background: #d73a49;
            color: white;
        }

        .row-added {
            background: #e6ffed;
        }

        .row-modified {
            background: #fff8e6;
        }

        .row-deleted {
            background: #ffeef0;
        }

        .row-added:hover {
            background: #d4f5dd !important;
        }

        .row-modified:hover {
            background: #fff0cc !important;
        }

        .row-deleted:hover {
            background: #ffdce0 !important;
        }

        .old-value {
            color: #d73a49;
            text-decoration: line-through;
            margin-bottom: 4px;
        }

        .new-value {
            color: #28a745;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <h2>GitHub String Collector</h2>

    <div id="status">
        Ready
    </div>

    <button id="collectButton">
        Collect Strings
    </button>

    <button id="copyButton" style="display: none;">
        Copy as Markdown
    </button>

    <div class="button-group" style="display: none;" id="smartExportGroup">
        <button id="downloadCSVButton">
            📥 Download CSV
        </button>
        <button id="mergeHelperButton">
            🧮 Merge Helper
        </button>
    </div>

    <div id="mergeHelperBox" class="helper-box"></div>

    <div id="output"></div>

    <script src="popup.js"></script>

</body>
</html>
